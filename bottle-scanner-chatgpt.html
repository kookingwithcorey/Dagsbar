<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f0c"><title>DAGS Scanner → ChatGPT</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0f0c;color:#f7fbf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:99;background:#111814;border-bottom:1px solid #29362e;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn,.file{border:1px solid #29362e;background:#172019;color:#f7fbf8;border-radius:12px;padding:11px;font-weight:800;text-align:center;font-size:13px}.primary{background:#35f58a;color:#06150c;border-color:#35f58a}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.status{grid-column:1/-1;font-size:11px;color:#9aaa9f;line-height:1.35}iframe{width:100%;height:calc(100vh - 94px);border:0;display:block;background:#0a0f0c}@media(max-width:560px){.bar{grid-template-columns:1fr}.status{grid-column:auto}iframe{height:calc(100vh - 142px)}}</style></head><body>
<div class="bar"><button id="share" class="btn primary">Share Batch to ChatGPT</button><label class="file">Import ChatGPT Results<input id="results" type="file" accept="application/json,.json"></label><div id="status" class="status">Use the scanner below normally. When the batch is ready, this creates one ZIP containing the bottle photos + DAGS 45-field manifest and opens the iPhone Share sheet.</div></div>
<iframe id="scanner" src="bottle-scanner.html" title="DAGS Bottle Scanner"></iframe>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const frame=document.getElementById('scanner'),status=document.getElementById('status');
function inject(){try{let d=frame.contentDocument,s=d.createElement('script');s.textContent=`window.__dagsChatBridge={getBottles:()=>bottles,save:()=>{saveMeta();render()},getBlob:async k=>await blobFor(k),fields:()=>F};`;d.body.appendChild(s);status.textContent='ChatGPT batch bridge ready. Select bottles in the scanner, then tap Share Batch to ChatGPT.'}catch(e){status.textContent='Could not connect to the scanner bridge: '+e.message}}
frame.addEventListener('load',()=>setTimeout(inject,250));
async function makeZip(){let w=frame.contentWindow,b=w.__dagsChatBridge;if(!b)throw Error('Scanner bridge is not ready');let all=b.getBottles(),selected=all.filter(x=>x.selected);if(!selected.length)selected=all;if(!selected.length)throw Error('Add at least one bottle first');let F=b.fields(),zip=new JSZip(),manifest={format:'DAGS_CHATGPT_BATCH_V1',created_at:new Date().toISOString(),instructions:'Deep research every bottle for maximum accuracy. Identify the exact release from all photos; cross-check official producer/distillery sources, reputable whiskey publications and reliable retailers; fill as many of the exact DAGS repository fields as reliably possible; never guess uncertain bottle-specific facts. Preserve manual fields. Return a JSON file with format DAGS_CHATGPT_RESULTS_V1 and bottles:[{bottle_id,record,confidence,needs_review_reason,sources}] plus an import-ready CSV/XLSX.',fields:F,bottles:[]};let n=0;for(const x of selected){n++;let item={bottle_id:x.data.id,bottle_number:n,current:x.data,manual_fields:Object.keys(x.manual||{}).filter(k=>x.manual[k]),photos:[]},p=0;for(const key of x.photos||[]){let blob=await b.getBlob(key);if(!blob)continue;p++;let ext=(blob.type||'').includes('png')?'png':'jpg',path=`bottle-${String(n).padStart(2,'0')}/photo-${p}.${ext}`;zip.file(path,blob);item.photos.push(path)}manifest.bottles.push(item)}zip.file('manifest.json',JSON.stringify(manifest,null,2));zip.file('README.txt','Upload this ZIP into your DAGS ChatGPT Project. ChatGPT should deep-research the bottles and return DAGS_CHATGPT_RESULTS_V1 JSON for re-import into the scanner.');let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});return new File([blob],`DAGS-Batch-for-ChatGPT-${Date.now()}.zip`,{type:'application/zip'})}
document.getElementById('share').onclick=async()=>{try{status.textContent='Preparing bottle batch…';let file=await makeZip();if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'DAGS Bottle Batch',text:'Bottle batch for ChatGPT deep research'});status.textContent='Shared. Choose ChatGPT from the iPhone Share sheet and use your DAGS Project.'}else{let u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);status.textContent='Batch ZIP downloaded. Upload that single ZIP into your DAGS ChatGPT Project.'}}catch(e){if(e.name!=='AbortError')status.textContent='Could not prepare batch: '+e.message}};
document.getElementById('results').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let raw=JSON.parse(await f.text());if(raw.format!=='DAGS_CHATGPT_RESULTS_V1'||!Array.isArray(raw.bottles))throw Error('This is not a DAGS ChatGPT results file');let b=frame.contentWindow.__dagsChatBridge,all=b.getBottles(),count=0;for(const r of raw.bottles){let x=all.find(q=>q.data.id===r.bottle_id);if(!x)continue;for(const [k,v] of Object.entries(r.record||{})){if(x.manual&&x.manual[k])continue;if(v!==undefined&&v!==null)x.data[k]=String(v)}x.scanStatus='';x.scanError='';if(r.needs_review_reason){x.data.needs_review='true';x.data.internal_notes=[x.data.internal_notes,r.needs_review_reason].filter(Boolean).join(' | ')}count++}b.save();status.textContent=`Imported ChatGPT research for ${count} bottle${count===1?'':'s'}. Review/approve them in the scanner below.`}catch(err){status.textContent='Import failed: '+err.message}e.target.value=''};
</script></body></html>

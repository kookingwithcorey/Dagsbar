<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f0c"><title>DAGS Scanner → ChatGPT</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0f0c;color:#f7fbf8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{position:sticky;top:0;z-index:99;background:#111814;border-bottom:1px solid #29362e;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn,.file{border:1px solid #29362e;background:#172019;color:#f7fbf8;border-radius:12px;padding:11px;font-weight:800;text-align:center;font-size:13px}.primary{background:#35f58a;color:#06150c;border-color:#35f58a}.danger{color:#ff9b9b;border-color:#573838}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}.status{grid-column:1/-1;font-size:11px;color:#9aaa9f;line-height:1.35}.batch{font-size:11px;color:#8dd8ff;font-weight:800}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:200}.modal.open{display:flex}.sheet{width:100%;max-height:80vh;overflow:auto;background:#0a0f0c;border-radius:22px 22px 0 0;padding:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.card{background:#111814;border:1px solid #29362e;border-radius:14px;padding:11px;margin:8px 0}.muted{font-size:11px;color:#9aaa9f;line-height:1.4}iframe{width:100%;height:calc(100vh - 139px);border:0;display:block;background:#0a0f0c}@media(max-width:700px){.bar{grid-template-columns:1fr 1fr}.status{grid-column:1/-1}iframe{height:calc(100vh - 196px)}}
</style></head><body>
<div class="bar"><button id="share" class="btn primary">Send Batch to ChatGPT</button><label class="file">Import ChatGPT Results<input id="results" type="file" accept="application/json,.json,.csv,.xlsx,.xls"></label><button id="newBatch" class="btn">New Batch</button><button id="history" class="btn">Previous Batches</button><button id="exportCsv" class="btn">Export CSV</button><div><span id="batch" class="batch">Batch 1</span></div><div id="status" class="status">Add bottle photos below. Select bottles, send the batch to ChatGPT for deep research, import the results, approve, then export CSV.</div></div>
<iframe id="scanner" src="bottle-scanner.html" title="DAGS Bottle Scanner"></iframe>
<div id="historyModal" class="modal"><div class="sheet"><div class="head"><b>Previous Batches</b><button id="closeHistory" class="btn">Close</button></div><div class="muted">Previous batches stay on this device and are included in the ChatGPT manifest as duplicate-reference data.</div><div id="historyList"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>
const frame=document.getElementById('scanner'),status=document.getElementById('status'),batchEl=document.getElementById('batch');
let batchNo=Number(localStorage.getItem('dags-chatgpt-batch-no')||'1');let history=JSON.parse(localStorage.getItem('dags-chatgpt-batch-history')||'[]');
function persistWrapper(){localStorage.setItem('dags-chatgpt-batch-no',String(batchNo));localStorage.setItem('dags-chatgpt-batch-history',JSON.stringify(history));batchEl.textContent='Batch '+batchNo}
function safeClone(v){return JSON.parse(JSON.stringify(v))}
function inject(){try{let d=frame.contentDocument,s=d.createElement('script');s.textContent=`
const __nativePut=put,__nativeGet=get,__nativeDel=del;
function __cacheReq(k){return new Request(location.origin+'/__dags_photo_cache__/'+encodeURIComponent(k))}
put=async function(k,v){let idbErr=null;try{return await __nativePut(k,v)}catch(e){idbErr=e}try{let c=await caches.open('dags-scanner-photo-cache-v1');await c.put(__cacheReq(k),new Response(v,{headers:{'Content-Type':v.type||'image/jpeg'}}));return}catch(e2){throw new Error('IndexedDB '+(idbErr?.name||'error')+': '+(idbErr?.message||'failed')+' | Cache '+(e2?.name||'error')+': '+(e2?.message||'failed'))}}
get=async function(k){try{let v=await __nativeGet(k);if(v)return v}catch{}try{let c=await caches.open('dags-scanner-photo-cache-v1'),r=await c.match(__cacheReq(k));return r?await r.blob():null}catch{return null}}
del=async function(k){try{await __nativeDel(k)}catch{}try{let c=await caches.open('dags-scanner-photo-cache-v1');await c.delete(__cacheReq(k))}catch{}}
db=function(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,2);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
async function __dagsOptimizeImage(file,maxSide=1400,quality=.72){return await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(reader.error||new Error('File read failed'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(new Error('Image decode failed: '+(file.type||'unknown type')));img.onload=()=>{try{let nw=img.naturalWidth||img.width,nh=img.naturalHeight||img.height,scale=Math.min(1,maxSide/Math.max(nw,nh)),w=Math.max(1,Math.round(nw*scale)),h=Math.max(1,Math.round(nh*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(blob=>blob?resolve(blob):reject(new Error('JPEG compression failed')),'image/jpeg',quality)}catch(e){reject(e)}};img.src=reader.result};reader.readAsDataURL(file)})}
storeOriginal=async function(file,bottle){let optimized;try{optimized=await __dagsOptimizeImage(file)}catch(e){optimized=file}const key=bottle.data.id+'-'+uid();await put(key,optimized);bottle.photos.push(key);bottle.scanError='';return key};
addNew=async function(file){let b=blank();bottles.push(b);saveMeta();await render();try{await storeOriginal(file,b);saveMeta();await render();toast('Bottle photo saved')}catch(e){console.error(e);b.scanError='Photo storage failed: '+(e.message||e);saveMeta();await render();toast('Photo storage failed')}};
addExtra=async function(i,files){if(!bottles[i])return;let added=0,lastErr='';for(const file of files){try{await storeOriginal(file,bottles[i]);added++}catch(e){console.error(e);lastErr=e.message||String(e)}}if(added)bottles[i].scanError='';else if(lastErr)bottles[i].scanError='Photo storage failed: '+lastErr;saveMeta();await render();toast(added?added+' photo'+(added===1?'':'s')+' attached':'Photo storage failed')};
const __oldOpenEditor=openEditor;openEditor=async function(i){await __oldOpenEditor(i);document.querySelectorAll('[data-remove-photo]').forEach(btn=>{btn.textContent='Delete';btn.style.width='auto';btn.style.minWidth='58px';btn.style.height='30px';btn.style.borderRadius='8px';btn.style.padding='4px 8px';btn.style.background='#7d2828';btn.style.fontSize='11px';btn.style.fontWeight='800'})};
const __oldRender=render;render=async function(){await __oldRender();document.querySelectorAll('#list .card').forEach((card,i)=>{let actions=card.querySelector('.cardBtns');if(!actions||actions.querySelector('[data-delete-bottle]'))return;let btn=document.createElement('button');btn.className='btn';btn.dataset.deleteBottle=i;btn.textContent='Delete Bottle';btn.style.color='#ff9b9b';btn.onclick=async()=>{let b=bottles[i];if(!b||!confirm('Delete this bottle and all attached photos from the current batch?'))return;for(const k of b.photos||[]){try{await del(k)}catch{}}bottles.splice(i,1);saveMeta();await render();toast('Bottle deleted')};actions.appendChild(btn);actions.style.gridTemplateColumns='1fr 1fr 1fr'});let tb=document.querySelector('.toolbar');if(tb&&!document.getElementById('deleteSelected')){let bulk=document.createElement('button');bulk.className='btn';bulk.id='deleteSelected';bulk.textContent='Delete Selected';bulk.style.color='#ff9b9b';bulk.onclick=async()=>{let selected=bottles.filter(b=>b.selected);if(!selected.length){toast('Select bottles first');return}if(!confirm('Delete '+selected.length+' selected bottle'+(selected.length===1?'':'s')+' and all attached photos?'))return;for(const b of selected){for(const k of b.photos||[]){try{await del(k)}catch{}}}bottles=bottles.filter(b=>!b.selected);saveMeta();await render();toast(selected.length+' bottle'+(selected.length===1?'':'s')+' deleted')};tb.appendChild(bulk)}};
window.__dagsChatBridge={getBottles:()=>bottles,save:()=>{saveMeta();render()},getBlob:async k=>await blobFor(k),fields:()=>F,clearCurrent:()=>{bottles=[];saveMeta();render()}};
render();`;d.body.appendChild(s);let hide=['selectIncomplete','clearBatch','deepScan','export'];for(const id of hide){let el=d.getElementById(id);if(el)el.style.display='none'}let ai=d.querySelector('.aiBox');if(ai)ai.style.display='none';let bottom=d.querySelector('.bottomgrid');if(bottom)bottom.style.gridTemplateColumns='1fr';let sub=d.querySelector('.sub');if(sub)sub.textContent='Add → ChatGPT Deep Research → Approve → Export CSV';status.textContent='Storage fallback loaded. New photos will try IndexedDB first, then browser Cache storage automatically.'}catch(e){status.textContent='Could not connect to scanner: '+e.message}}
frame.addEventListener('load',()=>setTimeout(inject,250));
function bridge(){let b=frame.contentWindow.__dagsChatBridge;if(!b)throw Error('Scanner bridge is not ready');return b}
async function makeZip(){let b=bridge(),all=b.getBottles(),selected=all.filter(x=>x.selected);if(!selected.length)selected=all;if(!selected.length)throw Error('Add at least one bottle first');let F=b.fields(),zip=new JSZip(),manifest={format:'DAGS_CHATGPT_BATCH_V2',batch_number:batchNo,created_at:new Date().toISOString(),instructions:'Deep research every bottle for maximum accuracy. Identify the exact bottle and exact release from every attached photo. Search broadly and cross-check official producer/distillery sources first, then reputable whiskey publications and reliable retailers. Fill as many of the exact DAGS repository fields as reliably possible. Never guess uncertain bottle-specific proof, age, batch, barrel, store-pick, release-year, mash-bill or price facts. Preserve manual fields. Compare against previous_batches and flag likely duplicates or same-expression/different-release records. Return a JSON file with format DAGS_CHATGPT_RESULTS_V1 and bottles:[{bottle_id,record,confidence,needs_review_reason,sources}] using the same bottle_id values. Also return an import-ready CSV/XLSX if useful.',fields:F,previous_batches:history.map(h=>({number:h.number,created_at:h.created_at,bottles:(h.bottles||[]).map(x=>({data:x.data||{}}))})),bottles:[]};let n=0;for(const x of selected){n++;let item={bottle_id:x.data.id,bottle_number:n,current:x.data,manual_fields:Object.keys(x.manual||{}).filter(k=>x.manual[k]),photos:[]},p=0;for(const key of x.photos||[]){let blob=await b.getBlob(key);if(!blob)continue;p++;let ext=(blob.type||'').includes('png')?'png':(blob.type||'').includes('webp')?'webp':'jpg',path=`bottle-${String(n).padStart(2,'0')}/photo-${String(p).padStart(2,'0')}.${ext}`;zip.file(path,blob);item.photos.push(path)}manifest.bottles.push(item)}zip.file('manifest.json',JSON.stringify(manifest,null,2));zip.file('README.txt',`DAGS Bottle Research Batch ${batchNo}\n\nUpload this ZIP into your DAGS ChatGPT Project. Ask ChatGPT to follow manifest.json, deep-research all bottles, and return DAGS_CHATGPT_RESULTS_V1 JSON so it can be imported back into the scanner.`);let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});return new File([blob],`DAGS-ChatGPT-Batch-${batchNo}.zip`,{type:'application/zip'})}
document.getElementById('share').onclick=async()=>{try{status.textContent='Preparing Batch '+batchNo+'…';let file=await makeZip();if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`DAGS Batch ${batchNo}`,text:'Bottle batch for ChatGPT deep research'});status.textContent='Batch ready. Choose ChatGPT in the Share sheet and use your DAGS Project.'}else{let u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);status.textContent='Batch ZIP downloaded. Upload that single ZIP into your DAGS ChatGPT Project.'}}catch(e){if(e.name!=='AbortError')status.textContent='Could not prepare batch: '+e.message}};
function mergeRecord(target,record){for(const [k,v] of Object.entries(record||{})){if(target.manual&&target.manual[k]&&String(target.data[k]||'').trim())continue;if(v!==undefined&&v!==null)target.data[k]=String(v)}}
function importJson(raw){if(raw.format!=='DAGS_CHATGPT_RESULTS_V1'||!Array.isArray(raw.bottles))throw Error('This is not a DAGS ChatGPT results file');let b=bridge(),all=b.getBottles(),count=0;for(const r of raw.bottles){let x=all.find(q=>q.data.id===r.bottle_id);if(!x)continue;mergeRecord(x,r.record);x.scanStatus='';x.scanError='';if(r.needs_review_reason){x.data.needs_review='true';x.data.internal_notes=[x.data.internal_notes,'Needs review: '+r.needs_review_reason].filter(Boolean).join(' | ')}if(Array.isArray(r.sources)&&r.sources.length){let src=r.sources.map(s=>s.url||s).filter(Boolean).join(' | ');if(src)x.data.internal_notes=[x.data.internal_notes,'Sources: '+src].filter(Boolean).join(' | ')}count++}b.save();return count}
function importRows(rows){let b=bridge(),all=b.getBottles(),count=0;for(const row of rows){let id=String(row.id||row.bottle_id||'').trim(),x=all.find(q=>String(q.data.id)===id);if(!x)continue;mergeRecord(x,row.record&&typeof row.record==='object'?row.record:row);count++}b.save();return count}
document.getElementById('results').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let count=0;if(f.name.toLowerCase().endsWith('.json')){count=importJson(JSON.parse(await f.text()))}else{if(typeof XLSX==='undefined')throw Error('Spreadsheet import library did not load');let wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''});count=importRows(rows)}status.textContent=`Imported ChatGPT research for ${count} bottle${count===1?'':'s'}. Review/edit below, then approve.`}catch(err){status.textContent='Import failed: '+err.message}e.target.value=''};
document.getElementById('newBatch').onclick=()=>{try{let b=bridge(),all=b.getBottles();if(all.length)history.unshift({number:batchNo,created_at:new Date().toISOString(),bottles:safeClone(all)});b.clearCurrent();batchNo++;persistWrapper();status.textContent=`Started Batch ${batchNo}. Previous batch saved for duplicate reference.`}catch(e){status.textContent='Could not start new batch: '+e.message}};
document.getElementById('history').onclick=()=>{let root=document.getElementById('historyList');root.innerHTML=history.length?history.map(h=>`<div class="card"><b>Batch ${h.number}</b><div class="muted">${(h.bottles||[]).length} bottle${(h.bottles||[]).length===1?'':'s'} · ${(h.bottles||[]).filter(x=>x.approved).length} approved</div><div class="muted">${(h.bottles||[]).slice(0,7).map(x=>(x.data&&x.data.name)||'Unnamed bottle').join(' · ')}${(h.bottles||[]).length>7?' · …':''}</div></div>`).join(''):'<div class="card muted">No previous batches yet.</div>';document.getElementById('historyModal').classList.add('open')};document.getElementById('closeHistory').onclick=()=>document.getElementById('historyModal').classList.remove('open');
function csvEscape(v){let s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
document.getElementById('exportCsv').onclick=async()=>{try{let b=bridge(),F=b.fields(),approved=b.getBottles().filter(x=>x.approved);if(!approved.length)throw Error('Approve at least one bottle first');let csv=[F.join(','),...approved.map(x=>F.map(f=>csvEscape(x.data[f])).join(','))].join('\r\n'),file=new File([csv],`DAGS-Bottle-Import-Batch-${batchNo}.csv`,{type:'text/csv'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'DAGS Bottle Import'})}else{let u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}status.textContent=`Exported ${approved.length} approved bottle${approved.length===1?'':'s'} as CSV.`}catch(e){if(e.name!=='AbortError')status.textContent='Export failed: '+e.message}};
persistWrapper();
</script></body></html>
